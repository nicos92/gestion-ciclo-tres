{{define "index"}}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo · Go + htmx</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; background: #1e1e2e; color: #cdd6f4; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .5rem; border-radius: .5rem; border: 1px solid #45475a; background: #313244; color: #cdd6f4; }
    button { padding: .5rem .9rem; border: none; border-radius: .5rem; background: #89b4fa; color: #11111b; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .5rem; border-bottom: 1px solid #313244; }
    li .text { flex: 1; }
    li.done .text { text-decoration: line-through; opacity: .6; }
    button.ghost { background: transparent; color: #89b4fa; }
    button.danger { background: transparent; color: #f38ba8; }
  </style>
</head>
<body>
  <h1>Todo · Go + htmx</h1>
  <form hx-post="/todo" hx-target="#todo-list" hx-swap="beforeend" hx-on::after-request="this.reset()">
    <input type="text" name="text" placeholder="¿Qué hay que hacer?" required>
    <button type="submit">Agregar</button>
  </form>
  <ul id="todo-list">
    {{range .}}
      {{template "todo_item" .}}
    {{end}}
  </ul>
</body>
</html>
{{end}}
