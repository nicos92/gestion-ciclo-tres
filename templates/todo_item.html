{{define "todo_item"}}
<li id="todo-{{.ID}}" class="{{if .Done}}done{{end}}">
  <button
    type="button"
    class="ghost"
    hx-post="/todo/{{.ID}}/toggle"
    hx-target="#todo-{{.ID}}"
    hx-swap="outerHTML"
    title="Cambiar estado"
  >{{if .Done}}☑{{else}}☐{{end}}</button>
  <span class="text">{{.Text}}</span>
  <button
    type="button"
    class="danger"
    hx-delete="/todo/{{.ID}}"
    hx-target="#todo-{{.ID}}"
    hx-swap="outerHTML"
    hx-confirm="¿Eliminar esta tarea?"
  >✕</button>
</li>
{{end}}
