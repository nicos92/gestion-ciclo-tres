{{define "styles"}}{{template "estilos_tarima" .}}{{end}} {{define "content"}}
<div class="container my-2">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card">
                <div class="card-header d-flex flex-wrap align-items-baseline gap-2 no-print">
                    <h5 class="mb-0">Editar Tarima</h5>
                    {{if .Tarima}}
                    <small class="text-muted">
                        Modifique los campos necesarios y guarde los cambios
                    </small>
                    {{end}}
                </div>
                <div class="card-body p-3">
                    {{if .Tarima}} {{template "form_tarimas" .}} {{else}}
                    <div class="alert alert-warning mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>Tarima no encontrada.
                        <a href="/tarimas" class="alert-link">Volver al inventario</a>
                    </div>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
