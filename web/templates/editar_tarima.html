{{define "styles"}}
<style>
    .btn-focus-animation {
        transition: box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .btn-focus-animation:focus {
        box-shadow: 0 0 0 0.5rem rgba(13, 110, 253, 0.25), 0 0 15px rgba(13, 110, 253, 0.5) !important;
        outline: none;
    }
    .btn-focus-animation:hover {
        box-shadow: 0 0 0 0.5rem rgba(13, 110, 253, 0.25), 0 0 15px rgba(13, 110, 253, 0.5);
    }
    .btn-focus-animation:active {
        box-shadow: 0 0 0 0.5rem rgba(13, 110, 253, 0.25), 0 0 8px rgba(13, 110, 253, 0.7) !important;
    }
</style>
{{end}}

{{define "content"}}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="form-card">
                <h3 class="mb-4">Editar Tarima</h3>
                {{if .Tarima}}
                <p class="text-muted mb-4">Modifique los campos necesarios y guarde los cambios</p>
                {{template "form_tarimas" .}}
                {{else}}
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>Tarima no encontrada.
                    <a href="/tarimas" class="alert-link">Volver al inventario</a>
                </div>
                {{end}}
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
    var autoDismiss = document.getElementById('auto-dismiss-alert');
    if (autoDismiss) {
        setTimeout(function() {
            var alert = new bootstrap.Alert(autoDismiss);
            alert.close();
        }, 5000);
    }
</script>
{{end}}
