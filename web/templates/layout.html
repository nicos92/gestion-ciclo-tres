<!doctype html>
<html lang="es" data-bs-theme="auto">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} - {{.AppName}}</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                padding-top: 72px;
            }
            .main-content {
                flex: 1;
            }

            .bd-mode-toggle {
              z-index: 1500;
            }

            .bd-mode-toggle .dropdown-menu .active .fa-check {
              display: block !important;
            }
        </style>
        {{block "styles" .}}{{end}}
    </head>
    <body>

        <div class="main-content">
            {{template "header" .}} {{template "content" .}}
        </div>

        <footer
            class="d-flex flex-wrap justify-content-between align-items-center p-3 my-4 border-top"
        >
            <div class="col-md-4 d-flex align-items-center">
                <span class="mb-3 mb-md-0 text-body-secondary"
                    >© 2026 Nicolás Sandoval</span
                >
            </div>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3">
                    <a
                        class="text-body-secondary"
                        href="#"
                        aria-label="Instagram"
                        ><i class="fab fa-instagram fa-lg"></i
                    ></a>
                </li>
                <li class="ms-3">
                    <a
                        class="text-body-secondary"
                        href="#"
                        aria-label="Facebook"
                        ><i class="fab fa-facebook fa-lg"></i
                    ></a>
                </li>
            </ul>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src="/static/shared.js"></script>
        <script>
            (() => {
                "use strict";

                const getStoredTheme = () => localStorage.getItem("theme");
                const setStoredTheme = (theme) => localStorage.setItem("theme", theme);

                const getPreferredTheme = () => {
                    const storedTheme = getStoredTheme();
                    if (storedTheme) {
                        return storedTheme;
                    }
                    return window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                };

                const setTheme = (theme) => {
                    const resolved =
                        theme === "auto"
                            ? window.matchMedia("(prefers-color-scheme: dark)").matches
                                ? "dark"
                                : "light"
                            : theme;
                    document.documentElement.setAttribute("data-bs-theme", resolved);
                };

                const icons = { light: "sun", dark: "moon", auto: "circle-half-stroke" };

                const showActiveTheme = (theme, focus = false) => {
                    const switcher = document.querySelector("#bd-theme");
                    if (!switcher) return;

                    const activeIcon = document.querySelector(".theme-icon-active");
                    const activeBtn = document.querySelector(
                        `[data-bs-theme-value="${theme}"]`
                    );

                    document.querySelectorAll("[data-bs-theme-value]").forEach((el) => {
                        el.classList.remove("active");
                        el.setAttribute("aria-pressed", "false");
                        const check = el.querySelector(".fa-check");
                        if (check) check.classList.add("d-none");
                    });

                    if (activeBtn) {
                        activeBtn.classList.add("active");
                        activeBtn.setAttribute("aria-pressed", "true");
                        const check = activeBtn.querySelector(".fa-check");
                        if (check) check.classList.remove("d-none");
                    }

                    if (activeIcon) {
                        activeIcon.className = `fas fa-${icons[theme]} theme-icon-active`;
                    }

                    switcher.setAttribute("aria-label", `Toggle theme (${theme})`);
                    if (focus) switcher.focus();
                };

                setTheme(getPreferredTheme());
                showActiveTheme(getPreferredTheme());

                window
                    .matchMedia("(prefers-color-scheme: dark)")
                    .addEventListener("change", () => {
                        const storedTheme = getStoredTheme();
                        if (storedTheme !== "light" && storedTheme !== "dark") {
                            setTheme(getPreferredTheme());
                        }
                    });

                document
                    .querySelectorAll("[data-bs-theme-value]")
                    .forEach((toggle) => {
                        toggle.addEventListener("click", () => {
                            const theme = toggle.getAttribute("data-bs-theme-value");
                            setStoredTheme(theme);
                            setTheme(theme);
                            showActiveTheme(theme, true);
                        });
                    });
            })();
        </script>
        {{block "scripts" .}}{{end}}
    </body>
</html>
