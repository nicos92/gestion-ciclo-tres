{{define "campo_nombre_producto"}}
<div class="input-group mb-3" id="campo-nombre-producto">
    <span class="input-group-text"><i class="fas fa-book"></i></span>
    <input
        type="text"
        class="form-control bg-body-secondary"
        id="nombreProducto"
        readonly
        tabindex="-1"
        aria-label="Nombre del producto, sólo lectura"
        placeholder="Sin nombre asignado en el catálogo"
        value="{{.Nombre}}"
    />
</div>
{{end}}
