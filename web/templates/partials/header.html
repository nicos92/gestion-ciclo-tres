{{define "header"}}
{{if .Session}}
<header class="form-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="mb-0"><i class="fas fa-cubes me-2"></i>Sistema de Inventario</h1>
            </div>
            <div class="col-md-4 text-md-end">
                <span class="me-3">Bienvenido, <strong>{{.Session.Username}}</strong></span>
                <button hx-post="/logout" hx-swap="none" class="btn logout-btn text-white">
                    <i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </div>
</header>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0,0,0,0.15);">
    <div class="container">
        <div class="navbar-nav">
            <a class="nav-link" href="/dashboard"><i class="fas fa-home me-1"></i>Panel</a>
            <a class="nav-link" href="/tarimas"><i class="fas fa-boxes me-1"></i>Tarimas</a>
            {{if ge .Session.Nivel 4}}
            <a class="nav-link" href="/usuarios"><i class="fas fa-users me-1"></i>Usuarios</a>
            {{end}}
        </div>
    </div>
</nav>
{{else}}
<header class="form-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="mb-0"><i class="fas fa-cubes me-2"></i>Sistema de Inventario</h1>
            </div>
        </div>
    </div>
</header>
{{end}}
{{end}}
